name: openGym Android Full HD APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/catalogue/**'
      - 'catalogue/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Stamp Android versionCode for CI release
        working-directory: frontend/android/app
        env:
          BUILD_CODE: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'build.gradle';
            const s = fs.readFileSync(p, 'utf8');
            const base = 27 + Number(process.env.BUILD_CODE || 1);
            fs.writeFileSync(p, s.replace(/versionCode\s+\d+/, 'versionCode ' + base));
            console.log('Stamped versionCode:', base);
          "

      - name: Build Full HD mobile assets and sync Capacitor
        working-directory: frontend
        env:
          VITE_MOBILE: '1'
          VITE_BUILTIN_CLIP_PX: '1080'
          VITE_APK_VARIANT: 'hd'
          APP_BUILD: ${{ github.run_number }}
        run: npm run build:mobile

      - name: Build sideload APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            ./gradlew --no-daemon assembleSideloadRelease
          else
            ./gradlew --no-daemon assembleSideloadDebug
          fi

      - name: Sign and checksum Full HD APK
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT="openGym-FullHD.apk"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            UNSIGNED="frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$OUT" aligned.apk
            rm -f release.keystore aligned.apk "${OUT}.idsig"
          else
            cp frontend/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "$OUT"
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish rolling signed APK release (android-signed-beta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-signed-beta
          name: openGym Full HD (Android APK)
          prerelease: false
          make_latest: false
          body: |
            Build automático Full HD (1080p) da branch `main`.
            versionCode: ${{ 27 + github.run_number }}
            commit: ${{ github.sha }}
          files: |
            openGym-FullHD.apk
            openGym-FullHD.apk.sha256

